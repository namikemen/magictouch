name: Release MagicTouch

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to release (e.g. v0.1.2, or leave blank to auto-detect from codebase)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  check-version:
    name: Determine Release Target
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Release Version
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.version_tag }}"
            CLEAN_VERSION="${RAW_TAG#v}"
            TAG="v$CLEAN_VERSION"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
            echo "Manual release requested for $TAG ($CLEAN_VERSION)"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Tag release triggered for $TAG ($VERSION)"
          else
            # Push to main branch: read version from UpdateChecker.swift
            VERSION=$(grep -E '@Published public var currentVersion: String =' Sources/MagicTouch/Engine/UpdateChecker.swift | sed -E 's/.*"([^"]+)".*/\1/')
            CHECK_TAG="v$VERSION"
            if git rev-parse "$CHECK_TAG" >/dev/null 2>&1 || git ls-remote --tags origin "$CHECK_TAG" | grep -q "$CHECK_TAG"; then
              echo "Tag $CHECK_TAG already exists. Skipping auto-release on main."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "New unreleased version $VERSION found on main! Automatically triggering release for $CHECK_TAG."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "tag=$CHECK_TAG" >> "$GITHUB_OUTPUT"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-macos:
    name: Build macOS Universal App
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Release Version
        id: version
        run: |
          TAG="${{ needs.check-version.outputs.tag }}"
          VERSION="${{ needs.check-version.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building MagicTouch version $VERSION (tag: $TAG)"

      - name: Package Universal App, DMG, and Tarball
        run: |
          chmod +x package_app.sh
          ./package_app.sh "${{ steps.version.outputs.version }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: |
            .build/dist/*.dmg
            .build/dist/*.tar.gz
            .build/dist/*.zip
            .build/dist/checksums.txt
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release & Updater Manifest
    needs: [check-version, build-macos]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Release Version
        id: version
        run: |
          TAG="${{ needs.check-version.outputs.tag }}"
          VERSION="${{ needs.check-version.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release-assets
          path: dist

      - name: Assemble latest.json Updater Manifest
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Extract git tag annotation or commit log
          TAG_MSG=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null | sed '/^[[:space:]]*$/d')
          if [ -z "$TAG_MSG" ]; then
            TAG_MSG=$(git log -1 --pretty=%B 2>/dev/null | head -n 5 || echo "MagicTouch $TAG release")
          fi
          export TAG_MSG
          export PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          TAR_SHA=$(sha256sum dist/MagicTouch.app.tar.gz 2>/dev/null | awk '{print $1}' || echo "")
          ZIP_SHA=$(sha256sum dist/MagicTouch-macOS.zip 2>/dev/null | awk '{print $1}' || echo "")
          DMG_SHA=""
          if [ -f dist/MagicTouch.dmg ]; then
            DMG_SHA=$(sha256sum dist/MagicTouch.dmg | awk '{print $1}')
          fi
          export TAR_SHA ZIP_SHA DMG_SHA

          python3 - << 'PY_EOF'
          import json, os

          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          notes = os.environ.get("TAG_MSG", f"MagicTouch {tag} release").strip()
          pub_date = os.environ["PUB_DATE"]
          tar_sha = os.environ.get("TAR_SHA", "")
          zip_sha = os.environ.get("ZIP_SHA", "")
          dmg_sha = os.environ.get("DMG_SHA", "")

          data = {
              "version": version,
              "notes": notes,
              "pub_date": pub_date,
              "platforms": {
                  "darwin-universal": {
                      "url": f"https://github.com/{repo}/releases/download/{tag}/MagicTouch.app.tar.gz",
                      "signature": tar_sha
                  },
                  "dmg": {
                      "url": f"https://github.com/{repo}/releases/download/{tag}/MagicTouch.dmg",
                      "signature": dmg_sha
                  },
                  "zip": {
                      "url": f"https://github.com/{repo}/releases/download/{tag}/MagicTouch-macOS.zip",
                      "signature": zip_sha
                  }
              }
          }

          with open("dist/latest.json", "w") as f:
              json.dump(data, f, indent=2)

          print("Generated latest.json:")
          print(json.dumps(data, indent=2))
          PY_EOF

          # Refresh checksums including latest.json
          (cd dist && sha256sum * > checksums.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MagicTouch ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
